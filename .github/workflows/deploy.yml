# main への push で、テスト → API のビルド → インフラの反映 → 画面のビルド → サイトの配置を行う。手動の起動（workflow_dispatch）は付けない。
# 守る条件は .github/tests/test_workflows.py、理由は docs/adr/0027-ci-cd-with-three-workflows.md
name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

# 同時に 2 つ走らせない。実行中の apply は途中で止めない（状態ファイルのロックが残るため）
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  # 伏せ字（mask-aws-account-id）はジョブ単位で効くので、AWS に入る手順は 1 つのジョブにまとめる
  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm の版は package.json の packageManager から取る
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - run: pnpm install --frozen-lockfile
      # Lambda に載せる zip の元。apply が読むので apply の前に作る。画面のビルドは apply の出力を使うので後に回す
      - run: pnpm --filter api build

      # ラッパーは標準出力に行を足し、terraform output -raw の値を壊す
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          mask-aws-account-id: true

      # apply のログに [id=...] の形でディストリビューション ID が出るのは許す（ID だけではアカウントを特定できない）
      - name: terraform apply
        working-directory: infra/app
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          # 共有の部品（Cognito など）の元。3 つとも未設定なら共有の部品は作られない（docs/adr/0035-share-by-unguessable-url-with-google-login.md）。-var では渡さない
          TF_VAR_google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
          TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TF_VAR_cognito_domain_prefix: ${{ secrets.COGNITO_DOMAIN_PREFIX }}
        run: |
          set -euo pipefail
          terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=app/terraform.tfstate" \
            -backend-config="region=$AWS_REGION"
          terraform apply -auto-approve -input=false -lock-timeout=5m -no-color -var="region=$AWS_REGION"

      # 共有の設定を画面に渡す。未設定のあいだは空文字で、画面に共有のボタンを出さない。
      # 値はビルド成果物に入る公開の値で、apply の出力にも出る（sensitive でない）。ここでの ::add-mask:: はこれ以降のログでの念のため（空でないときだけ）
      - name: 画面をビルドする
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
        run: |
          set -euo pipefail
          VITE_COGNITO_DOMAIN="$(terraform -chdir=infra/app output -raw cognito_domain_url)"
          VITE_COGNITO_CLIENT_ID="$(terraform -chdir=infra/app output -raw cognito_client_id)"
          for value in "$VITE_COGNITO_DOMAIN" "$VITE_COGNITO_CLIENT_ID"; do
            if [ -n "$value" ]; then echo "::add-mask::$value"; fi
          done
          export VITE_COGNITO_DOMAIN VITE_COGNITO_CLIENT_ID
          pnpm --filter web build

      # 値は echo せず、::add-mask:: の行だけを出して伏せる。以降は同じステップの中で使う（ステップをまたぐと伏せ字が効くか不確かなため）
      - name: サイトを置いてキャッシュを消す
        run: |
          set -euo pipefail
          BUCKET="$(terraform -chdir=infra/app output -raw site_bucket_name)"
          DISTRIBUTION_ID="$(terraform -chdir=infra/app output -raw distribution_id)"
          echo "::add-mask::$BUCKET"
          echo "::add-mask::$DISTRIBUTION_ID"

          # 古い index.html を持つ閲覧者が、消えたファイルで 404 にならない順序:
          # (a) 新しい assets を足す → (b) index.html など assets 以外を入れ替えて古いものを消す → (c) 古い assets を消す
          IMMUTABLE="public, max-age=31536000, immutable"
          aws s3 sync apps/web/dist/assets "s3://$BUCKET/assets" --only-show-errors --cache-control "$IMMUTABLE"
          aws s3 sync apps/web/dist "s3://$BUCKET" --only-show-errors --cache-control "no-cache" --exclude "assets/*" --delete
          aws s3 sync apps/web/dist/assets "s3://$BUCKET/assets" --only-show-errors --cache-control "$IMMUTABLE" --delete

          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*" > /dev/null
