# テスト。PR で動き、deploy.yml からも呼ばれる（main への push には付けない。二重に走らないため）。
# AWS には入らない。守る条件は .github/tests/test_workflows.py、理由は docs/adr/0027-ci-cd-with-three-workflows.md
name: test

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm の版は package.json の packageManager から取る
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

      # 版は手元と同じに固定する。ラッパーは標準出力に行を足すので切る（plan.yml・deploy.yml と同じ設定）
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: terraform（infra/bootstrap と infra/app）
        run: |
          set -euo pipefail
          for dir in infra/bootstrap infra/app; do
            terraform -chdir="$dir" fmt -check -recursive
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            terraform -chdir="$dir" test
          done

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - run: python -m unittest discover -s .github/tests
