# infra/app を変える PR（plan.yml 自身の変更を含む）で terraform plan を流す。apply はしない（反映は main へのマージ後に deploy.yml が行う）。
# plan の出力にはアカウントIDの入ったバケット名が出うるので、ジョブのログにだけ出し、PR のコメントやサマリーには載せない。
# 守る条件は .github/tests/test_workflows.py、理由は docs/adr/0027-ci-cd-with-three-workflows.md と docs/adr/0031-skip-ci-by-path-without-required-checks.md
name: plan

on:
  pull_request:
    paths: [infra/app/**, .github/workflows/plan.yml]

# 同じ PR の plan は待ちを 1 つにまとめる。plan は状態ファイルのロックを持つので、途中では止めない（取り消さない）
concurrency:
  group: plan-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # 伏せ字（mask-aws-account-id）はジョブ単位で効くので、AWS に入る手順は 1 つのジョブにまとめる
  plan:
    # fork の PR は動かさない（Secrets が渡らず、信頼できないコードでもあるため）
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # API のビルド成果物は Lambda の zip の元で、共有の部品があると plan が読む。AWS の認証情報を取る前に済ませる
      # （docs/adr/0036-let-plan-build-api-with-sharing-secrets.md）。pnpm の版は package.json の packageManager から取る
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api build

      # ラッパーは標準出力に行を足す
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          mask-aws-account-id: true

      - name: terraform plan
        working-directory: infra/app
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          # 渡さないと、共有の部品を消す差分がすべての PR の plan に出る。未設定なら共有の部品は作られない
          TF_VAR_google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
          TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TF_VAR_cognito_domain_prefix: ${{ secrets.COGNITO_DOMAIN_PREFIX }}
        run: |
          set -euo pipefail
          terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=app/terraform.tfstate" \
            -backend-config="region=$AWS_REGION"
          terraform plan -input=false -lock-timeout=5m -no-color -var="region=$AWS_REGION"
